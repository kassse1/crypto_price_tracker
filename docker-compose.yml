
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A app.tasks.celery_app worker -B --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
    depends_on:
      - api
      - redis

  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Local only: the database is not exposed to the network.
      - "127.0.0.1:5432:5432"

  redis:
    image: redis
